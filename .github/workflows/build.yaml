# CoraOS Rust Caller Workflow
#
# Secrets are inherited from the organization — no setup needed.

name: Build CoraOS Rust Tool

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"
  workflow_dispatch:

jobs:
  build:
    uses: Cora-Linux-Distro/CI-TEMPLATES/.github/workflows/rust-simple.yml@main
    with:
      binary_name: coraos-gpu-detection
      working_directory: .
      release_name: CoraOS GPU Detector
    secrets: inherit
